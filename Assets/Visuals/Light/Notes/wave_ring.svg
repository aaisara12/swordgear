<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Resonance's sound-wave front: a crisp core stroke over a wider, faint one so the front reads as a
       glowing wave rather than a hard line. Centreline radius 46 of a 100 box, i.e. 0.92 of the sprite's
       half-width; HarpWave.spriteRadius must match. Drawn white so the Opalite shader supplies the colour. -->
  <g fill="none" stroke="#FFFFFF">
    <circle cx="50" cy="50" r="46" stroke-width="7" stroke-opacity="0.28"/>
    <circle cx="50" cy="50" r="46" stroke-width="2.5"/>
  </g>
</svg>

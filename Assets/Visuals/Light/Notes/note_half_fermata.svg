<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 66" width="36" height="66">
  <!-- A half note under a fermata: Fermata's glyph. The fermata means "hold this note", and the tune
       holds you: a moment where nothing can touch you. Hollow notehead with a stem, and the fermata's
       arc and dot above. Drawn white so the Opalite shader supplies all of its colour. -->
  <g fill="#FFFFFF">
    <path d="M 5 17 C 5 2.5 31 2.5 31 17 L 28.6 17 C 28.2 7.6 7.8 7.6 7.4 17 Z"/>
    <circle cx="18" cy="14.4" r="2.3"/>
    <path fill-rule="evenodd" d="
      M 8.99 60.19 A 6.4 4.5 -20 1 0 21.01 55.81 A 6.4 4.5 -20 1 0 8.99 60.19 Z
      M 11.40 60.53 A 4.4 1.6 -35 1 0 18.60 55.47 A 4.4 1.6 -35 1 0 11.40 60.53 Z"/>
    <rect x="20.2" y="24" width="1.4" height="34"/>
  </g>
</svg>

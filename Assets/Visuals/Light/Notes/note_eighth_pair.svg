<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52" width="44" height="52">
  <!-- Two eighth notes beamed together: Resonance's glyph. One beam = eighths, and two notes because the
       tune pulses twice. Drawn white so the Opalite shader supplies all of its colour. -->
  <g fill="#FFFFFF">
    <ellipse cx="10" cy="44" rx="6.4" ry="4.5" transform="rotate(-20 10 44)"/>
    <ellipse cx="30" cy="41" rx="6.4" ry="4.5" transform="rotate(-20 30 41)"/>
    <rect x="15.2" y="8.0" width="1.4" height="36.0"/>
    <rect x="35.2" y="6.6" width="1.4" height="34.4"/>
    <polygon points="15.2,8.0 36.6,6.5 36.6,11.0 15.2,12.5"/>
  </g>
</svg>

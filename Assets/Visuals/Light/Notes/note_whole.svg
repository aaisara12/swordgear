<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" width="30" height="20">
  <!-- A whole note: Lullaby's glyph. The longest value there is, for the one tune that works slowly
       over time. Wide hollow oval with the hole tilted, as engraved; drawn a little larger than a true
       notehead because it stands alone as a reveal with no stem to give it presence.
       Drawn white so the Opalite shader supplies all of its colour. -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="
    M 2 10 A 13 8.6 0 1 0 28 10 A 13 8.6 0 1 0 2 10 Z
    M 9.48 14.63 A 7.2 4.4 -40 1 0 20.52 5.37 A 7.2 4.4 -40 1 0 9.48 14.63 Z"/>
</svg>

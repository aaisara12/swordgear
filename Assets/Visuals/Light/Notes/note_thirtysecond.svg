<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 50" width="30" height="50">
  <!-- A thirty-second note, stem up, three flags: Presto's glyph. The fastest note on the harp for the tune
       that makes you fastest. Same box and notehead as the sixteenth and eighth; the stem runs longer, as
       engraved, to fit the third flag. Drawn white so the Opalite shader supplies all of its colour. -->
  <g fill="#FFFFFF">
    <ellipse cx="11" cy="42" rx="6.4" ry="4.5" transform="rotate(-20 11 42)"/>
    <rect x="16.2" y="2" width="1.4" height="40"/>
    <path d="M 17.6 2 C 18.6 8.5 26.6 11 25 20 C 24.2 14.4 20.6 12 17.6 11 Z"/>
    <path d="M 17.6 8.5 C 18.6 15 26.6 17.5 25 26.5 C 24.2 20.9 20.6 18.5 17.6 17.5 Z"/>
    <path d="M 17.6 15 C 18.6 21.5 26.6 24 25 33 C 24.2 27.4 20.6 25 17.6 24 Z"/>
  </g>
</svg>

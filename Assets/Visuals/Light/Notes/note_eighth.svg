<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 50" width="30" height="50">
  <!-- A single eighth note, stem up, one flag: the archetypal drifting music note. Lullaby's floating
       notes and, from commit 15, Allegro's glyph. Same box and notehead as the sixteenth.
       Drawn white so the Opalite shader supplies all of its colour. -->
  <g fill="#FFFFFF">
    <ellipse cx="11" cy="42" rx="6.4" ry="4.5" transform="rotate(-20 11 42)"/>
    <rect x="16.2" y="6" width="1.4" height="36"/>
    <path d="M 17.6 6 C 18.6 14 28.2 17 25.6 30 C 24.8 22.4 20.6 18.6 17.6 17 Z"/>
  </g>
</svg>

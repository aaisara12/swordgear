<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" width="30" height="20">
  <!-- One stack marker: an up-chevron. Streak icons stack one to three of these, climbing in a loop.
       A dark stroke under a white one gives the outline. White takes the Opalite colour. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="5,16 15,6 25,16" stroke="#0E0D14" stroke-width="9"/>
    <polyline points="5,16 15,6 25,16" stroke="#FFFFFF" stroke-width="5"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 60" width="48" height="60">
  <!-- Light's harp, for the "Learn a tune" augment card. Column on the left, a curved neck along the top,
       the soundboard running diagonally from the foot up to the end of the neck, strings dropping from
       the neck to the soundboard. Dark outline baked in so it reads on any card tier's background. -->
  <g stroke-linecap="round">
    <g stroke="#0E0D14" stroke-width="3">
      <line x1="16" y1="13" x2="16" y2="46"/><line x1="20" y1="12" x2="20" y2="40"/>
      <line x1="24" y1="12" x2="24" y2="34"/><line x1="28" y1="12" x2="28" y2="28"/>
      <line x1="32" y1="11" x2="32" y2="22"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="1.3">
      <line x1="16" y1="13" x2="16" y2="46"/><line x1="20" y1="12" x2="20" y2="40"/>
      <line x1="24" y1="12" x2="24" y2="34"/><line x1="28" y1="12" x2="28" y2="28"/>
      <line x1="32" y1="11" x2="32" y2="22"/>
    </g>
    <line x1="12" y1="52" x2="40" y2="10" stroke="#0E0D14" stroke-width="8"/>
    <line x1="12" y1="52" x2="40" y2="10" stroke="#FFFFFF" stroke-width="4.6"/>
  </g>
  <g fill="#FFFFFF" stroke="#0E0D14" stroke-width="2.6" stroke-linejoin="round">
    <rect x="5" y="9" width="6.5" height="46" rx="2.5"/>
    <path d="M 6 11 C 15 3 26 14 41 6 L 43 12 C 28 20 17 10 10 16 Z"/>
    <rect x="3" y="51" width="22" height="6.5" rx="2.5"/>
  </g>
</svg>

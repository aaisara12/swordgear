    <path d="M 15 4 L 33 4 L 43 56 L 5 56 Z" fill="#FFFFFF"/>
    <rect x="2" y="55" width="44" height="7" rx="2" fill="#FFFFFF"/>
  </g>
  <path d="M 19.5 10 L 28.5 10 L 33 46 L 15 46 Z" fill="#0E0D14"/>
</svg>

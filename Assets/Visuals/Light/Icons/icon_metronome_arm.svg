<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 46" width="12" height="46">
  <!-- The metronome's swinging arm: a rod with a sliding weight. Imported with a bottom-centre pivot so
       it rotates about the body's pivot point. Dark outline baked in; white fill takes the Opalite colour. -->
  <g fill="#FFFFFF" stroke="#0E0D14" stroke-width="2.2" stroke-linejoin="round">
    <rect x="4.4" y="2" width="3.2" height="43" rx="1.2"/>
    <rect x="1.3" y="12" width="9.4" height="7" rx="1.6"/>
  </g>
</svg>
